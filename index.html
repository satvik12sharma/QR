<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Sadhika ❤️</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', cursive;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        color: white;
    }
	
.love-img {
    width: 100%;
    max-width: 300px;   /* controls size */
    height: auto;
    border-radius: 15px;
    margin: 15px auto;
    display: block;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

    .card {
        background: rgba(255, 255, 255, 0.15);
        padding: 30px;
        border-radius: 20px;
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        max-width: 400px;
        animation: fadeIn 2s ease-in-out;
    }

    h1 {
        font-size: 2.5em;
        margin-bottom: 15px;
    }

    img {
        width: 100%;
        border-radius: 15px;
        margin-bottom: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }
    .heart {
    font-size: 40px;
    margin-top: 10px;
    animation: heartbeat 1s infinite;
}
@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-100vh); opacity: 0; }
}
h1 {
  text-shadow: 0 0 10px white, 0 0 20px pink;
}
@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.4);
    }
}
    p {
        font-size: 1.2em;
        line-height: 1.6;
    }

    .heart {
        font-size: 2em;
        animation: heartbeat 1s infinite;
    }

    @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.3); }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px);}
        to { opacity: 1; transform: translateY(0);}
    }
</style>

</head>
<script>
setInterval(() => {
  let heart = document.createElement("div");
  heart.innerHTML = "❤️";
  heart.style.position = "fixed";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.bottom = "0";
  heart.style.fontSize = "20px";
  heart.style.animation = "floatUp 4s linear";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 4000);
}, 500);
</script>
<script>
let text = "Every moment with you feels like magic ✨";
let i = 0;

function typeEffect() {
  if (i < text.length) {
    document.getElementById("message").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeEffect, 50);
  }
}
typeEffect();
</script>
<body>

<div class="card">
    <div class="heart">❤️</div>
<p id="message"></p>
    <h1>I Love You Sadhika</h1>

    <!-- ADD YOUR IMAGE HERE -->
    <img src="love.jpeg" alt="Us ❤️" class="love-img">
    <div class="heart">❤️</div>

    <p>
        Every moment with you feels like magic ✨<br><br>
        Your smile is my peace, your presence is my happiness 💖<br><br>
        No matter where life takes us,<br>
        I will always hold your hand and choose you again and again ❤️<br><br>
        Forever yours.
        </p>
        <button onclick="showMessage()">Click me ❤️</button>

<p id="hidden" style="display:none;">
I love you till the moon and back my little princess 💖
</p>

<script>
function showMessage() {
  document.getElementById("hidden").style.display = "block";
}
</script>
 
</div>

</body>
</html>
